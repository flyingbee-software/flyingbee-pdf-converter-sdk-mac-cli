# PDF conversion via Flyingbee PDF Converter SDK (macOS CLI)
#
# NOTE for production use:
#   1. This package uses an EXPIRED trial license (converts the first 3 pages only).
#      Buy a valid license from Flyingbee and inject the license file via secrets
#      before using it in CI.
#   2. FPPDFConverter is a UNIVERSAL binary (arm64 + x86_64), so it runs natively
#      on every macOS runner. Unlike the Linux package there is nothing to rename
#      per architecture - just call ./FPPDFConverter.
#   3. The SDK payload (FPPDFFramework.framework + Resources.bundle) is large.
#      Fetching it from a private GitHub Release (or actions/cache) keeps the
#      repository small. The steps below assume the SDK is already present at
#      ./FPPDFFramework_CLI for demo purposes.

name: PDF Convert (Flyingbee SDK)

on:
  workflow_dispatch:
    inputs:
      input_pdf:
        description: "Path to the PDF to convert (relative to repo root)"
        required: true
        default: "FPPDFFramework_CLI/Test.pdf"
      format:
        description: "Output format"
        required: true
        default: "docx"
        type: choice
        options: [docx, xlsx, pptx, txt, html, csv]
      pages:
        description: "Page range, e.g. 'all' or '1-3'"
        required: false
        default: "all"

jobs:
  convert:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # (Optional) If the SDK is distributed as a Release asset instead of committed:
      # - name: Download SDK
      #   run: |
      #     curl -fL -o sdk.zip "${{ secrets.SDK_RELEASE_URL }}"
      #     unzip -q sdk.zip

      - name: Inspect SDK
        shell: bash
        run: |
          ls -la FPPDFFramework_CLI
          file FPPDFFramework_CLI/FPPDFConverter

      - name: Clear quarantine and re-sign ad hoc
        shell: bash
        run: |
          # Files restored by git can carry the com.apple.quarantine attribute,
          # which makes Gatekeeper refuse to launch the binary. Clear it and apply
          # an ad-hoc signature. Both steps are best effort on a CI runner.
          xattr -dr com.apple.quarantine FPPDFFramework_CLI || true
          codesign --force --sign - FPPDFFramework_CLI/FPPDFConverter || true
          codesign --force --deep --sign - FPPDFFramework_CLI/FPPDFFramework.framework || true
          chmod +x FPPDFFramework_CLI/FPPDFConverter

      - name: Install recommended fonts (best effort)
        shell: bash
        run: |
          # The README recommends Arial / Consolas / Courier / Times New Roman for
          # the best conversion fidelity. macOS already ships Times and Courier;
          # add metric-compatible Liberation fonts as Arial substitutes. Failures
          # here must never block the conversion step.
          brew install --cask font-liberation || true

      - name: Convert PDF
        shell: bash
        env:
          # Pass inputs through the environment instead of expanding ${{ ... }}
          # straight into the script body, so a crafted input cannot inject shell.
          INPUT_PDF: ${{ github.event.inputs.input_pdf }}
          INPUT_FORMAT: ${{ github.event.inputs.format }}
          INPUT_PAGES: ${{ github.event.inputs.pages }}
        run: |
          set -e
          repo="$PWD"
          cd FPPDFFramework_CLI

          in="$INPUT_PDF"
          fmt="$INPUT_FORMAT"
          pages="$INPUT_PAGES"
          if [[ "$in" != /* ]]; then
            in="$repo/$in"
          fi
          base=$(basename "$in")
          out="$repo/output/${base%.*}.${fmt}"
          mkdir -p "$repo/output"

          ./FPPDFConverter -a PDF2Files -i "$in" -o "$out" -f "$fmt" -p "$pages" || true
          # The converter exits non-zero when the license is expired/trial even if
          # it produced the file, so decide success by the output file instead.
          if [ ! -f "$out" ]; then
            echo "::error::Conversion failed: expected output '$out' was not created."
            exit 1
          fi
          echo "Output produced: $out"
          exit 0

      - name: Upload result
        uses: actions/upload-artifact@v6
        with:
          name: converted-${{ github.event.inputs.format }}
          path: output/
